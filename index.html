<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07060f">
<title>EPINOR | لینک‌ها</title>
<meta name="description" content="همه‌ی شبکه‌های اجتماعی EPINOR در یک صفحه">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'YekanBakh';src:url('yekan.woff') format('woff');font-display:swap}
:root{
  --ink:#07060f; --night:#0e0c1f; --line:rgba(255,255,255,.09);
  --text:#f4f2fb; --mute:#9d99b8; --teal:#35e0ee; --pink:#ff3d8b;
}
*{box-sizing:border-box;margin:0}
html{background:var(--ink)}
body{
  font-family:'YekanBakh',Tahoma,sans-serif; color:var(--text); background:var(--ink);
  min-height:100vh; -webkit-font-smoothing:antialiased; overflow-x:hidden;
  padding-bottom:env(safe-area-inset-bottom,0);
}
/* پس‌زمینه: همان عکس، بزرگ و محو، تا نور نئون صفحه را پر کند */
.ambient{position:fixed;inset:0;z-index:-1;overflow:hidden}
.ambient::before{
  content:"";position:absolute;inset:-10%;background:url(logo.jpg) center/cover;
  filter:blur(70px) saturate(1.6);opacity:.38;transform:scale(1.2);
}
.ambient::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(7,6,15,.35),var(--ink) 75%)}

.wrap{max-width:460px;margin:0 auto;padding:0 20px 56px}

/* هیرو */
.hero{position:relative;margin:0 -20px;aspect-ratio:4/4.6;max-height:520px;overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover;object-position:50% 22%;display:block;
  -webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent)}
.hero-text{position:absolute;inset-inline:20px;bottom:6px}
.name{
  font-family:'Outfit',sans-serif;font-weight:800;direction:ltr;text-align:right;
  font-size:clamp(3.4rem,17vw,5rem);line-height:.95;letter-spacing:-.02em;
  background:linear-gradient(100deg,#fff 20%,var(--teal) 60%,var(--pink));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 30px rgba(53,224,238,.25));
}
.sub{margin-top:10px;color:var(--mute);font-size:.95rem}

/* لیست لینک‌ها */
.links{list-style:none;padding:0;margin-top:26px;display:flex;flex-direction:column;gap:10px}
.link{
  --c:#fff; position:relative;display:flex;align-items:center;gap:14px;
  padding:14px 14px 14px 18px;border-radius:18px;text-decoration:none;color:var(--text);
  background:rgba(255,255,255,.045);border:1px solid var(--line);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  overflow:hidden;isolation:isolate;transition:transform .25s ease,border-color .25s ease;
  -webkit-tap-highlight-color:transparent;
}
/* نور دنبال‌کننده‌ی موس/لمس */
.link::before{
  content:"";position:absolute;inset:0;z-index:-1;opacity:0;transition:opacity .3s;
  background:radial-gradient(260px circle at var(--x,50%) var(--y,50%),color-mix(in srgb,var(--c) 28%,transparent),transparent 70%);
}
.link:hover::before,.link:focus-visible::before,.link:active::before{opacity:1}
.link:hover,.link:focus-visible{border-color:color-mix(in srgb,var(--c) 55%,transparent);transform:translateY(-2px)}
.link:active{transform:scale(.985)}
.link:focus-visible{outline:2px solid var(--c);outline-offset:3px}

.ico{
  flex:none;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;
  background:color-mix(in srgb,var(--c) 14%,rgba(255,255,255,.04));
  color:var(--c);border:1px solid color-mix(in srgb,var(--c) 30%,transparent);
  transition:background .3s,color .3s,box-shadow .3s;
}
.ico svg{width:24px;height:24px;fill:currentColor}
.link:hover .ico,.link:focus-visible .ico{background:var(--c);color:#07060f;box-shadow:0 8px 24px -6px var(--c)}

.txt{flex:1;min-width:0}
.title{display:block;font-size:1.1rem;line-height:1.3}
.handle{display:block;direction:ltr;text-align:right;color:var(--mute);font-size:.85rem;margin-top:2px;
  font-family:'Outfit',sans-serif;font-weight:600;letter-spacing:.01em}
.go{flex:none;width:20px;height:20px;color:var(--mute);transition:transform .3s,color .3s}
.link:hover .go,.link:focus-visible .go{color:var(--text);transform:translateX(-4px)}

footer{margin-top:34px;text-align:center;color:var(--mute);font-size:.8rem;
  font-family:'Outfit',sans-serif;letter-spacing:.12em;direction:ltr}

/* ورود: یک حرکت هماهنگ برای کل صفحه */
@media (prefers-reduced-motion:no-preference){
  .hero img{animation:rise 1.1s cubic-bezier(.2,.8,.2,1) both}
  .name{animation:rise 1s .15s cubic-bezier(.2,.8,.2,1) both}
  .sub{animation:rise 1s .25s cubic-bezier(.2,.8,.2,1) both}
  .links li{animation:rise .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(.35s + var(--i)*.08s)}
  @keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
}
@media (min-width:700px){
  .wrap{padding-top:40px}
  .hero{margin:0;border-radius:28px;aspect-ratio:4/3.4}
  .hero-text{inset-inline:26px}
}
</style>
</head>
<body>
<div class="ambient" aria-hidden="true"></div>

<main class="wrap">
  <header class="hero">
    <img src="logo.jpg" alt="تصویر EPINOR" fetchpriority="high">
    <div class="hero-text">
      <h1 class="name">EPINOR</h1>
      <p class="sub">از اینجا دنبالم کن</p>
    </div>
  </header>

  <ul class="links">
    <li style="--i:0"><a class="link" style="--c:#2AABEE" href="https://t.me/EPINORR" target="_blank" rel="noopener">
      <span class="ico"><svg viewBox="0 0 24 24"><path d="M21.9 3.6a1.2 1.2 0 0 0-1.2-.2L2.7 10.4c-.9.4-.9 1.6 0 1.9l4.4 1.4 1.7 5.3c.2.7 1 .9 1.5.4l2.4-2.3 4.4 3.3c.6.4 1.4.1 1.6-.6L22.2 4.9c.1-.5-.1-1-.3-1.3zM9.4 13.3l8.1-5.1-6.3 6.6-.3 2.9-1.5-4.4z"/></svg></span>
      <span class="txt"><span class="title">تلگرام</span><span class="handle">@EPINORR</span></span>
      <svg class="go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
    </a></li>

    <li style="--i:1"><a class="link" style="--c:#ff4f9a" href="https://instagram.com/epin0r" target="_blank" rel="noopener">
      <span class="ico"><svg viewBox="0 0 24 24"><path d="M7.5 2h9A5.5 5.5 0 0 1 22 7.5v9a5.5 5.5 0 0 1-5.5 5.5h-9A5.5 5.5 0 0 1 2 16.5v-9A5.5 5.5 0 0 1 7.5 2zm0 2A3.5 3.5 0 0 0 4 7.5v9A3.5 3.5 0 0 0 7.5 20h9a3.5 3.5 0 0 0 3.5-3.5v-9A3.5 3.5 0 0 0 16.5 4h-9zM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6zm5.3-3.1a1.2 1.2 0 1 1 0 2.4 1.2 1.2 0 0 1 0-2.4z"/></svg></span>
      <span class="txt"><span class="title">اینستاگرام</span><span class="handle">@epin0r</span></span>
      <svg class="go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
    </a></li>

    <li style="--i:2"><a class="link" style="--c:#ff3b3b" href="https://youtube.com/@epinorr" target="_blank" rel="noopener">
      <span class="ico"><svg viewBox="0 0 24 24"><path d="M21.6 7.2a2.5 2.5 0 0 0-1.8-1.8C18 5 12 5 12 5s-6 0-7.8.4a2.5 2.5 0 0 0-1.8 1.8C2 8.800 2 12 2 12s0 3.2.4 4.8a2.5 2.5 0 0 0 1.8 1.8C5.800 19 12 19 12 19s6 0 7.8-.4a2.5 2.5 0 0 0 1.8-1.8c.4-1.600.4-4.8.4-4.8s0-3.2-.4-4.8zM10 15V9l5.200 3-5.200 3z"/></svg></span>
      <span class="txt"><span class="title">یوتیوب</span><span class="handle">@epinorr</span></span>
      <svg class="go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
    </a></li>

    <li style="--i:3"><a class="link" style="--c:#53fc18" href="https://kick.com/epinor" target="_blank" rel="noopener">
      <span class="ico"><svg viewBox="0 0 512 512" style="width:22px;height:22px"><path fill-rule="evenodd" d="M37 .036h164.448v113.621h54.71v-56.82h54.731V.036h164.448v170.777h-54.73v56.82h-54.711v56.8h54.71v56.82h54.73V512.03H310.89v-56.82h-54.73v-56.8h-54.711v113.62H37V.036z"/></svg></span>
      <span class="txt"><span class="title">کیک</span><span class="handle">kick.com/epinor</span></span>
      <svg class="go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
    </a></li>
    <!-- برای فعال‌کردن تیک‌تاک، یک <li> مثل بالا اضافه کن با --c:#35e0ee و آدرس خودت -->
  </ul>

  <footer>EPINOR</footer>
</main>

<script>
/* نور دنبال‌کننده روی هر لینک (موس و لمس) */
document.querySelectorAll('.link').forEach(el=>{
  const move=e=>{const r=el.getBoundingClientRect();
    el.style.setProperty('--x',(e.clientX-r.left)+'px');
    el.style.setProperty('--y',(e.clientY-r.top)+'px')};
  el.addEventListener('pointermove',move);
  el.addEventListener('pointerdown',move);
});
</script>
</body>
</html>
